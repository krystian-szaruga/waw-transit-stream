apiVersion: v1
kind: Pod
metadata:
  name: waw-transit-app
  labels:
    app: waw-transit-app
spec:
  restartPolicy: Always
  containers:
  - name: backend
    image: localhost/waw-transit-backend:latest
    env:
    - name: TIMEZONE
      value: "${TIMEZONE}"
    - name: DB_HOST
      value: "waw-transit-infra"
    - name: DB_PORT
      value: "5432"
    - name: DB_NAME
      value: "${DB_NAME}"
    - name: DB_USER
      value: "${DB_USER}"
    - name: DB_PASSWORD
      value: "${DB_PASSWORD}"
    - name: REDIS_HOST
      value: "waw-transit-infra"
    - name: REDIS_PORT
      value: "6379"
    - name: REDIS_PASSWORD
      value: "${REDIS_PASSWORD}"
    - name: REDIS_DB
      value: "${REDIS_DB}"

  - name: web
    image: localhost/waw-transit-web:latest
    ports:
    - containerPort: 80
      hostPort: 8080
