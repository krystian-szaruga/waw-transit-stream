apiVersion: v1
kind: Pod
metadata:
  name: waw-transit-infra
  labels:
    app: waw-transit-infra
spec:
  restartPolicy: Always
  containers:
  - name: postgres
    image: postgis/postgis:15-3.3
    env:
    - name: POSTGRES_USER
      value: "${DB_USER}"
    - name: POSTGRES_PASSWORD
      value: "${DB_PASSWORD}"
    - name: POSTGRES_DB
      value: "${DB_NAME}"
    volumeMounts:
    - mountPath: /var/lib/postgresql/data
      name: postgres-data
    - mountPath: /docker-entrypoint-initdb.d:z
      name: postgres-init-dir
      readOnly: true

  - name: redis
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  volumes:
  - name: postgres-data
    persistentVolumeClaim:
      claimName: waw-transit-postgres-data
  - name: postgres-init-dir
    hostPath:
      path: ./database
      type: Directory
