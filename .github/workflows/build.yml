name: Build images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build pipeline image
        run: docker build -f infra/images/pipeline.Dockerfile -t waw-transit-pipeline:ci .

      - name: Build backend image
        run: docker build -f infra/images/backend.Dockerfile -t waw-transit-backend:ci .

      - name: Build web image
        run: docker build -f infra/images/web.Dockerfile -t waw-transit-web:ci .
