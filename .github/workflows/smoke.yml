name: Live smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WARSAW_API_TOKEN: ${{ secrets.WARSAW_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        run: test -n "$WARSAW_API_TOKEN"

      - name: Install Podman and envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y podman gettext-base

      - name: Write infra/.env
        run: |
          umask 077
          DB_PASSWORD=$(openssl rand -hex 16)
          REDIS_PASSWORD=$(openssl rand -hex 16)
          CLUSTER_ID=$(python3 -c "import base64,uuid; print(base64.urlsafe_b64encode(uuid.uuid4().bytes).decode().rstrip('='))")
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$REDIS_PASSWORD"
          echo "::add-mask::$CLUSTER_ID"
          cat > infra/.env <<EOF
          DB_NAME=waw_transit_ci
          DB_USER=waw_transit_ci
          DB_PASSWORD=${DB_PASSWORD}
          REDIS_PORT=6379
          REDIS_PASSWORD=${REDIS_PASSWORD}
          WARSAW_API_TOKEN=${WARSAW_API_TOKEN}
          FETCH_INTERVAL_SECONDS=15
          TIMEZONE=Europe/Warsaw
          PROCESSING_STATS_ENABLED=false
          REDIS_DB=0
          KAFKA_CLIENT_ID=warsaw-transit-ci
          KAFKA_TOPIC_BUSES=warsaw_transit_buses_raw
          KAFKA_TOPIC_TRAMS=warsaw_transit_trams_raw
          KAFKA_TOPIC_GTFS_VERSION=waw_transit_gtfs_versions
          KAFKA_STARTING_OFFSETS=latest
          CLUSTER_ID=${CLUSTER_ID}
          EOF
          chmod 600 infra/.env

      - name: Start stack
        working-directory: infra
        run: ./up.sh

      - name: Check frontend and API
        run: |
          curl -sf http://localhost:8080/ | grep -q 'Warsaw Transit'
          curl -sf 'http://localhost:8080/api/stops' | python3 -c 'import json,sys; assert len(json.load(sys.stdin)) > 0'

      - name: Wait for live vehicles
        run: |
          for attempt in $(seq 1 60); do
            count=$(curl -sf http://localhost:8080/api/vehicles | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' || echo 0)
            if [ "$count" -gt 0 ]; then
              echo "live vehicles: $count"
              exit 0
            fi
            sleep 10
          done
          echo "no live vehicles after 10 minutes"
          exit 1

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          podman logs waw-transit-pipeline-pipeline > logs/pipeline.log 2>&1 || true
          podman logs waw-transit-app-backend > logs/backend.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs
          path: logs

      - name: Stop stack
        if: always()
        working-directory: infra
        run: ./down.sh

      - name: Remove generated env
        if: always()
        run: rm -f infra/.env
