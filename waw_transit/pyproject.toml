[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "waw-transit"
version = "0.1.0"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
package-dir = { "waw_transit" = "." }
packages = [
    "waw_transit",
    "waw_transit.config",
    "waw_transit.core",
    "waw_transit.core.models",
    "waw_transit.core.repository",
    "waw_transit.core.request",
    "waw_transit.database",
    "waw_transit.database.postgres",
    "waw_transit.database.postgres.repository",
    "waw_transit.database.redis",
]
