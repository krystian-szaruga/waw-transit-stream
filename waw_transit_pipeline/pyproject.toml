[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "waw-transit-pipeline"
version = "0.1.0"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
package-dir = { "waw_transit_pipeline" = "." }
packages = [
    "waw_transit_pipeline",
    "waw_transit_pipeline.adapters",
    "waw_transit_pipeline.adapters.gtfs",
    "waw_transit_pipeline.adapters.kafka",
    "waw_transit_pipeline.adapters.spark",
    "waw_transit_pipeline.adapters.ztm",
    "waw_transit_pipeline.composition",
    "waw_transit_pipeline.core",
    "waw_transit_pipeline.core.config",
    "waw_transit_pipeline.core.models",
    "waw_transit_pipeline.core.ports",
    "waw_transit_pipeline.gtfs",
    "waw_transit_pipeline.gtfs.loader",
    "waw_transit_pipeline.gtfs.loader.builder",
    "waw_transit_pipeline.ingest",
    "waw_transit_pipeline.ingest.config",
    "waw_transit_pipeline.ingest.pipeline",
    "waw_transit_pipeline.ingest.publisher",
    "waw_transit_pipeline.processing",
    "waw_transit_pipeline.processing.assignment",
    "waw_transit_pipeline.processing.assignment.records",
    "waw_transit_pipeline.processing.config",
    "waw_transit_pipeline.processing.lookup",
    "waw_transit_pipeline.processing.model",
    "waw_transit_pipeline.processing.sink",
    "waw_transit_pipeline.supervisor",
]
